name: Verify

on:
  pull_request:

jobs:
  verify:
    name: Success
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          load: true
          provenance: false
          push: false
          tags: github-bot-signed-commit:${{ github.sha }}
          target: verify

      - name: Verify container image
        shell: bash
        run: |
          docker run --rm github-bot-signed-commit:${{ github.sha }}
